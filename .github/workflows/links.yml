name: links

on:
  pull_request:
    paths:
      - '**.md'
      - '.github/workflows/links.yml'
  schedule:
    # Weekly at Monday 06:00 UTC — catches external URL rot even when
    # docs aren't being edited.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Walks every .md file, resolves relative links, section anchors,
      # and external URLs. Verbose output, fails on broken links.
      #
      # --accept 401,403: many sites (reddit, meshcapade, nvcr.io registry)
      # gate unauthenticated bots behind 401/403 while the URLs resolve fine
      # in a browser — don't fail CI on those.
      #
      # The 'Humanoid Robot Info...' file is a raw team-notes dump (chat
      # exports, placeholder URLs). It's archival, not authoritative docs,
      # so we skip link-checking it.
      - name: Link check
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose --no-progress
            --accept 200..=299,401,403
            --exclude-path .claude
            --exclude-path GR00T-WholeBodyControl
            --exclude-path PromptHMR
            --exclude-path GMR
            --exclude-path 'docs/Humanoid Robot Info for AI Lab People .md'
            './**/*.md'
          fail: true
